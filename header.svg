    <text x="58" y="191" fill="#EFE8FD" font-family="Arial, Helvetica, sans-serif" font-size="25">Desenvolvedor em formação</text>
    <text x="58" y="235" fill="#B390FA" font-family="Arial, Helvetica, sans-serif" font-size="20">Web · Mobile · Automação · IA aplicada</text>
    <text x="58" y="302" fill="#EFE8FD" font-family="Arial, Helvetica, sans-serif" font-size="18">Construindo soluções digitais com propósito.</text>
