<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="title desc">
  <title id="title">Henry Marques — desenvolvimento web, mobile e automação</title>
  <desc id="desc">Banner nas cores violeta, lavanda e noite. Construindo soluções digitais com propósito.</desc>
  <defs>
