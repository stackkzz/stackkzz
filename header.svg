      <stop offset="0" stop-color="#5926C8"/>
      <stop offset="1" stop-color="#1A0F3C"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#B390FA"/>
      <stop offset="1" stop-color="#5926C8"/>
